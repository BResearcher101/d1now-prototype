<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About D1 Now</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Poppins:700,500,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #3058FF;
      --footer-blue: #144182;
      --white: #FFF;
      --yellow: #FFDF1B;
      --ink: #232f49;
      --muted: #6b7aa5;
      --soft-bg: #F4F6FB;
      --soft-ink: #2e3b55;
      --shadow: 0 6px 28px rgba(0, 0, 0, 0.08);
      --maxw: 1200px;
    }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background-color: var(--soft-bg);
      color: var(--soft-ink);
    }
    .hero-about {
      background: #ffffff;
      border-radius: 32px;
      margin: 40px auto;
      padding: 60px 40px;
      max-width: var(--maxw);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .hero-text h1 {
      font-family: Poppins, Inter, sans-serif;
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--footer-blue);
      margin-bottom: 20px;
    }
    .hero-text p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--soft-ink);
      margin-bottom: 30px;
    }
    .hero-btn {
      display: inline-block;
      background: linear-gradient(to right, #3058FF, #47B881);
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .hero-btn:hover {
      opacity: 0.92;
      transform: translateY(-2px);
    }
    .hero-image img {
      width: 100%;
      border-radius: 28px;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <header style="background: var(--footer-blue); color: white; padding: 20px; text-align: center;">
    <h2>D1 Now</h2>
  </header>

  <main>
    <section class="hero-about">
      <div class="hero-text">
        <p style="font-weight: 600; color: var(--blue); margin: 0 0 10px 0;">D1 Now • Youth-Centred Diabetes Research</p>
        <h1>Transforming Type 1 Diabetes Care with Young Adults</h1>
        <p>D1 Now is a research programme co-created with young adults in Ireland, shaping a new approach to diabetes care that values lived experience and shared decision-making.</p>
        <a href="#about" class="hero-btn">Learn more ↓</a>
      </div>
      <div class="hero-image">
        <img src="/mnt/data/3e9e6e76-1f14-45cb-b2c8-c64e495216e4.png" alt="Young adult enjoying greenery">
      </div>
    </section>
  </main>
</body>
</html>
