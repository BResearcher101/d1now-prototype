<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D1 Now – Homepage</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #3058FF;
      --pink: #FF388E;
      --yellow: #FFDF1B;
      --green: #31C48D;
      --footer-blue: #144182;
      --white: #FFF;
      --black: #111;
      --shadow: 0 4px 32px 0 rgba(0,0,0,0.08);
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: var(--blue);
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--blue);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 68px;
    }
    .header-container {
      display: flex;
      align-items: center;
      width: 100%;
      justify-content: space-between;
    }
    .logo {
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 1px;
      margin-right: 32px;
    }
    nav {
      display: flex;
      flex: 1;
      justify-content: space-between;
      align-items: center;
      gap: 22px;
      max-width: 1000px;
      margin: 0 auto;
    }
    nav a {
      color: var(--white);
      text-decoration: none;
      font-weight: 500;
      font-size: 1.08rem;
      transition: opacity 0.2s;
      letter-spacing: 0.2px;
      padding: 6px 16px;
      border-radius: 6px;
    }
    nav a:hover {
      background: rgba(255,255,255,0.08);
      opacity: 0.82;
    }
    .main-content {
      flex: 1;
      display: flex;
      width: 100%;
      min-height: 0;
      background: var(--green);
      position: relative;
      overflow: visible;
    }
    /* IMAGE AREA */
    .img-col {
      flex: 2.6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--pink);
      min-width: 0;
      position: relative;
      min-height: 420px;
      overflow: visible;
      flex-direction: column;
      gap: 0.8rem;
    }
    .main-img-placeholder {
      width: 97%;
      height: 92%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--pink);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      min-height: 340px;
      min-width: 300px;
      max-width: 850px;
      max-height: 720px;
    }
    .main-carousel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 28px;
      background: #eee;
      display: block;
      opacity: 1;
      transition: opacity 0.7s cubic-bezier(.61,-0.06,.57,1.18);
      position: absolute;
      left: 0; top: 0;
    }
    .main-carousel-img.fading {
      opacity: 0;
      pointer-events: none;
    }
    /* Carousel Controls */
    .carousel-controls {
      margin-top: 12px;
      display: flex;
      gap: 18px;
      justify-content: center;
      align-items: center;
    }
    .carousel-btn {
      border: none;
      background: linear-gradient(90deg, var(--yellow) 20%, var(--pink) 100%);
      color: var(--black);
      font-size: 1.9rem;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px 0 rgba(0,0,0,0.08);
      cursor: pointer;
      transition: background 0.22s, box-shadow 0.18s, transform 0.16s;
      outline: none;
      opacity: 0.92;
    }
    .carousel-btn:active, .carousel-btn:focus {
      background: var(--yellow);
      box-shadow: 0 2px 14px 0 rgba(0,0,0,0.15);
      opacity: 1;
      transform: scale(1.06) rotate(-6deg);
    }
    .carousel-btn svg {
      width: 25px; height: 25px;
      pointer-events: none;
    }
    /* CTA, TEXT, HAND */
    .cta-col {
      flex: 1.1;
      background: var(--green);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 56px 32px 0 32px;
      min-width: 0;
      position: relative;
      z-index: 2;
      min-height: 420px;
      overflow: visible;
    }
    .main-headline {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 13px;
      color: var(--black);
      line-height: 1.18;
      max-width: 100%;
      text-align: left;
    }
    .main-subline {
      font-size: 1.13rem;
      color: #123;
      margin-bottom: 36px;
      max-width: 100%;
      text-align: left;
    }
    .cta-btns {
      width: 100%;
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: stretch;
    }
    .cta-btn {
      border: none;
      border-radius: 17px;
      font-size: 1.19rem;
      font-weight: 700;
      padding: 22px 0;
      margin: 0;
      cursor: pointer;
      box-shadow: 0 8px 26px 0 rgba(0,0,0,0.13), 0 2px 8px rgba(255, 56, 142, 0.11);
      transition: 
        filter 0.17s, 
        transform 0.16s, 
        box-shadow 0.2s,
        background 0.27s;
      outline: none;
      background: linear-gradient(90deg, var(--yellow) 5%, var(--pink) 100%);
      color: var(--black);
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
      will-change: transform;
      /* fun micro jiggle effect on hover (via keyframes below) */
    }
    .cta-btn.btn-blue {
      background: linear-gradient(90deg, var(--blue) 15%, var(--green) 95%);
      color: #fff;
      box-shadow: 0 8px 28px 0 rgba(48,88,255,0.14), 0 2px 8px rgba(49,196,141, 0.07);
    }
    .cta-btn:hover, .cta-btn:focus {
      filter: brightness(1.06) saturate(1.2);
      box-shadow: 0 12px 36px 0 rgba(0,0,0,0.16), 0 4px 12px rgba(255, 56, 142, 0.11);
      transform: scale(1.07) rotate(-1.3deg);
      animation: btn-jiggle 0.25s linear;
      z-index: 1;
    }
    .cta-btn:active {
      filter: brightness(0.98);
      transform: scale(0.98) rotate(0.5deg);
      box-shadow: 0 3px 12px 0 rgba(0,0,0,0.10);
    }
    @keyframes btn-jiggle {
      0% { transform: scale(1.07) rotate(-1deg);}
      40% { transform: scale(0.97) rotate(1deg);}
      80% { transform: scale(1.04) rotate(-2deg);}
      100% { transform: scale(1.07) rotate(-1.3deg);}
    }
    /* HAND IMAGE ON RIGHT, EVEN LARGER AND OVERLAPPING */
    .hand-img-holder {
      position: absolute;
      right: -130px;
      bottom: 22px;
      width: 286px;
      min-width: 200px;
      max-width: 320px;
      z-index: 3;
      pointer-events: none;
    }
    .hand-img-holder img {
      width: 100%;
      min-width: 200px;
      height: auto;
      display: block;
      border-radius: 22px;
      background: var(--yellow);
      box-shadow: 0 2px 12px rgba(0,0,0,0.13);
    }
    /* FOOTER */
    footer {
      width: 100%;
      background: var(--footer-blue);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 36px 10px 36px;
      font-size: 1rem;
      min-height: 58px;
      box-sizing: border-box;
    }
    .footer-logos {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .footer-logos img {
      height: 32px;
      width: auto;
      margin-right: 7px;
      vertical-align: middle;
    }
    .footer-fund-text {
      font-size: 1rem;
      color: #DAE2FF;
      margin-right: 4px;
      vertical-align: middle;
    }
    .footer-links {
      display: flex;
      gap: 32px;
    }
    .footer-links a {
      color: var(--white);
      text-decoration: none;
      font-weight: 400;
      font-size: 1rem;
      opacity: 0.92;
      transition: opacity 0.16s;
    }
    .footer-links a:hover { opacity: 0.7;}
    /* POPUP MODAL */
    .modal-bg {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0; top: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.45);
      align-items: center;
      justify-content: center;
    }
    .modal-bg.active { display: flex; }
    .modal-popup {
      background: #fff;
      border-radius: 22px;
      padding: 26px 22px 22px 22px;
      max-width: 98vw;
      max-height: 98vh;
      box-shadow: 0 10px 60px rgba(70,0,70,0.16);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .modal-popup img {
      display: block;
      max-width: 65vw;
      max-height: 74vh;
      border-radius: 18px;
      background: #f2f2f2;
      margin-bottom: 4px;
    }
    .modal-close {
      position: absolute;
      top: 9px; right: 13px;
      font-size: 1.65rem;
      color: #444;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.18s;
      z-index: 120;
    }
    .modal-close:hover { opacity: 1; }
    /* RESPONSIVE */
    @media (max-width: 1300px) {
      .hand-img-holder { right: -60px; width: 200px;}
    }
    @media (max-width: 1000px) {
      .main-content { flex-direction: column; }
      .img-col, .cta-col { width: 100%; flex: unset; min-height: 260px;}
      .cta-col { align-items: center; padding: 36px 6vw 18px 6vw;}
      .main-headline, .main-subline { max-width: 98vw;}
      .main-img-placeholder { max-width: 80vw; min-height: 210px;}
      .main-img-placeholder img { min-height: 150px; }
      .hand-img-holder { margin-top: 12px; width: 120px; right: -20px;}
    }
    @media (max-width: 700px) {
      header, footer { padding-left: 10px; padding-right: 10px;}
      .main-content { min-height: unset;}
      .main-img-placeholder { min-height: 90px;}
      .cta-btns { margin-bottom: 16px;}
      .hand-img-holder { width: 50vw; max-width:120px; right:-10px;}
      .footer-logos img { height: 18px;}
      nav { flex-wrap: wrap; justify-content: center; gap: 5px;}
    }
  </style>
</head>
<body>
  <!-- ========== HEADER & NAV ========== -->
  <header>
    <div class="header-container">
      <span class="logo">D1 Now</span>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Young Adults (YAP)</a>
        <a href="#">Trial Participants</a>
        <a href="#">Trial Sites</a>
        <a href="#">Publications</a>
      </nav>
    </div>
  </header>

  <!-- ========== MAIN AREA ========== -->
  <main class="main-content">
    <!-- ==== Main Image (left, very wide, with carousel) ==== -->
    <div class="img-col">
      <div class="main-img-placeholder" style="position:relative;">
        <!-- Carousel images, only one is visible at a time (fade animation) -->
        <img id="mainCarouselImage"
             src="https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/home.png"
             alt="Main page visual"
             class="main-carousel-img"
             style="position:relative;"/>
      </div>
      <!-- Carousel Controls -->
      <div class="carousel-controls">
        <button class="carousel-btn" id="prevBtn" title="Previous image" aria-label="Previous image">
          <svg viewBox="0 0 30 30"><path d="M20 5L10 15L20 25" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="carousel-btn" id="nextBtn" title="Next image" aria-label="Next image">
          <svg viewBox="0 0 30 30"><path d="M10 5L20 15L10 25" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <!-- ==== CTA, Text, Hand (right) ==== -->
    <div class="cta-col">
      <div class="main-headline">
        A community for young adults with Type 1 Diabetes in Ireland.
      </div>
      <div class="main-subline">
        Built by and for you. Find support, join research, shape change.
      </div>
      <div class="cta-btns">
        <button class="cta-btn btn-yellow">Join Now</button>
        <button class="cta-btn btn-blue">Learn More</button>
      </div>
      <!-- HAND IMAGE PLACEHOLDER -->
      <div class="hand-img-holder">
        <img src="https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/hand.png" alt="Inviting hand illustration">
      </div>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer>
    <div class="footer-logos">
      <span class="footer-fund-text">Funded by</span>
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/HRB_logo.png" alt="HRB Logo" style="background:white;border-radius:3px;padding:2px 4px;">
      <img src="https://www.universityofgalway.ie/themes/universityofgalway/images/logo.png" alt="University of Galway Logo">
    </div>
    <div class="footer-links">
      <a href="#">FAQ</a>
      <a href="#">Contact</a>
      <a href="#">Subscribe</a>
    </div>
  </footer>

  <!-- ========== POPUP RECRUITMENT POSTER ========== -->
  <div class="modal-bg" id="recruitmentModal">
    <div class="modal-popup">
      <button class="modal-close" onclick="document.getElementById('recruitmentModal').classList.remove('active')">&times;</button>
      <img src="https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/rec.png" alt="Recruitment Poster">
    </div>
  </div>
  <script>
    // --- Main image carousel/slideshow with fade ---
    const mainImageUrls = [
      "https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/home.png",
      "https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/home1.png",
      "https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/home2.png",
      "https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/home3.png",
      "https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/home4.png",
      "https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/home5.png",
      "https://raw.githubusercontent.com/BResearcher101/d1now-prototype/main/images/home6.png"
      // Add more image URLs as needed
    ];
    let mainImgIndex = 0;
    let autoInterval = null;
    const mainImgElem = document.getElementById("mainCarouselImage");
    function showMainImg(index, fade=true) {
      if (fade) {
        mainImgElem.classList.add('fading');
        setTimeout(() => {
          mainImgElem.src = mainImageUrls[index];
          mainImgElem.classList.remove('fading');
        }, 400);
      } else {
        mainImgElem.src = mainImageUrls[index];
      }
    }
    function showNextMainImg(fade=true) {
      mainImgIndex = (mainImgIndex + 1) % mainImageUrls.length;
      showMainImg(mainImgIndex, fade);
    }
    function showPrevMainImg(fade=true) {
      mainImgIndex = (mainImgIndex - 1 + mainImageUrls.length) % mainImageUrls.length;
      showMainImg(mainImgIndex, fade);
    }
    function startAutoCarousel() {
      if (autoInterval) clearInterval(autoInterval);
      autoInterval = setInterval(() => showNextMainImg(true), 3000);
    }
    document.getElementById("prevBtn").onclick = function() {
      showPrevMainImg(true);
      startAutoCarousel();
    };
    document.getElementById("nextBtn").onclick = function() {
      showNextMainImg(true);
      startAutoCarousel();
    };
    // Initial setup
    mainImgElem.src = mainImageUrls[mainImgIndex];
    startAutoCarousel();

    // Show popup on page load
    window.addEventListener('DOMContentLoaded', function() {
      document.getElementById('recruitmentModal').classList.add('active');
    });
  </script>
</body>
</html>
