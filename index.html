<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D1 Now – Homepage</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #3058FF;
      --pink: #FF388E;
      --yellow: #FFDF1B;
      --green: #31C48D;
      --footer-blue: #144182;
      --white: #FFF;
      --black: #111;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: var(--blue);
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--blue);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 68px;
    }
    .header-container {
      display: flex;
      align-items: center;
      width: 100%;
      justify-content: space-between;
    }
    .logo {
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 1px;
      margin-right: 32px;
    }
    nav {
      display: flex;
      flex: 1;
      justify-content: space-between;
      align-items: center;
      gap: 22px;
      max-width: 850px;
      margin: 0 auto;
    }
    nav a {
      color: var(--white);
      text-decoration: none;
      font-weight: 500;
      font-size: 1.08rem;
      transition: opacity 0.2s;
      letter-spacing: 0.2px;
      padding: 6px 16px;
      border-radius: 6px;
    }
    nav a:hover {
      background: rgba(255,255,255,0.08);
      opacity: 0.82;
    }

    .main-content {
      flex: 1;
      display: flex;
      width: 100%;
      min-height: 0;
      /* Make the main image and its background more dominant */
      background: var(--green);
    }
    /* IMAGE AREA */
    .img-col {
      flex: 2.5; /* Wider! */
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--pink); /* Now solid pink */
      min-width: 0;
      position: relative;
      min-height: 420px;
    }
    .main-img-placeholder {
      width: 97%;
      height: 92%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--pink); /* Pink behind image */
      border-radius: 28px;
      box-shadow: 0 6px 32px 0 rgba(0,0,0,0.08);
      overflow: hidden;
      position: relative;
      min-height: 340px;
      min-width: 300px;
      max-width: 850px;
      max-height: 720px;
    }
    .main-img-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;   /* Ensures any image fits and fills the frame */
      border-radius: 28px;
      background: #eee;
      display: block;
    }
    /* CTA, TEXT, HAND */
    .cta-col {
      flex: 1.2;
      background: var(--green);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 56px 32px 0 32px;
      min-width: 0;
      position: relative;
      z-index: 2;
      min-height: 420px;
    }
    .main-headline {
      font-size: 1.72rem;
      font-weight: 700;
      margin-bottom: 13px;
      color: var(--black);
      line-height: 1.18;
      max-width: 350px;
    }
    .main-subline {
      font-size: 1.09rem;
      color: #123;
      margin-bottom: 36px;
      max-width: 325px;
    }
    .cta-btns {
      width: 100%;
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: stretch;
    }
    .cta-btn {
      border: none;
      border-radius: 10px;
      font-size: 1.13rem;
      font-weight: 600;
      padding: 18px 0;
      margin: 0;
      cursor: pointer;
      box-shadow: 0 4px 18px 0 rgba(0,0,0,0.09);
      transition: filter 0.18s, transform 0.15s;
      outline: none;
    }
    .cta-btn.btn-yellow { background: var(--yellow); color: var(--black);}
    .cta-btn.btn-pink { background: var(--pink); color: var(--white);}
    .cta-btn.btn-blue { background: var(--blue); color: var(--white);}
    .cta-btn:active { filter: brightness(0.92); transform: scale(0.98);}
    /* HAND IMAGE ON RIGHT BELOW BUTTONS */
    .hand-img-holder {
      width: 120px;
      margin-top: 26px;
      align-self: flex-end; /* right-align */
    }
    .hand-img-holder img {
      width: 100%;
      height: auto;
      max-width: 120px;
      display: block;
      border-radius: 18px;
      background: var(--yellow);
    }
    /* FOOTER */
    footer {
      width: 100%;
      background: var(--footer-blue);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 36px 10px 36px;
      font-size: 1rem;
      min-height: 58px;
      box-sizing: border-box;
    }
    .footer-logos {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .footer-logos img {
      height: 32px;
      width: auto;
      margin-right: 7px;
      vertical-align: middle;
    }
    .footer-fund-text {
      font-size: 1rem;
      color: #DAE2FF;
      margin-right: 4px;
      vertical-align: middle;
    }
    .footer-links {
      display: flex;
      gap: 32px;
    }
    .footer-links a {
      color: var(--white);
      text-decoration: none;
      font-weight: 400;
      font-size: 1rem;
      opacity: 0.92;
      transition: opacity 0.16s;
    }
    .footer-links a:hover { opacity: 0.7;}
    /* RESPONSIVE */
    @media (max-width: 1150px) {
      nav { max-width: 97vw; gap: 8px; }
    }
    @media (max-width: 1000px) {
      .main-content { flex-direction: column; }
      .img-col, .cta-col { width: 100%; flex: unset; min-height: 260px;}
      .cta-col { align-items: center; padding: 36px 6vw 18px 6vw;}
      .main-headline, .main-subline { max-width: 98vw;}
      .main-img-placeholder { max-width: 80vw; min-height: 210px;}
      .main-img-placeholder img { min-height: 150px; }
      .hand-img-holder { margin-top: 12px; width: 80px;}
    }
    @media (max-width: 700px) {
      header, footer { padding-left: 10px; padding-right: 10px;}
      .main-content { min-height: unset;}
      .main-img-placeholder { min-height: 90px;}
      .cta-btns { margin-bottom: 16px;}
      .hand-img-holder { width: 58px;}
      .footer-logos img { height: 18px;}
      nav { flex-wrap: wrap; justify-content: center; gap: 5px;}
    }
  </style>
</head>
<body>
  <!-- ========== HEADER & NAV ========== -->
  <header>
    <div class="header-container">
      <span class="logo">D1 Now</span>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Young Adults (YAP)</a>
        <a href="#">Trial Participants</a>
        <a href="#">Trial Sites</a>
        <a href="#">Publications</a>
      </nav>
    </div>
  </header>

  <!-- ========== MAIN AREA ========== -->
  <main class="main-content">
    <!-- ==== Main Image (left, very wide) ==== -->
    <div class="img-col">
      <div class="main-img-placeholder">
        <!-- 
          MAIN IMAGE PLACEHOLDER: 
          Replace the src below with your actual RAW GitHub image link 
          e.g. https://raw.githubusercontent.com/youruser/yourrepo/main/images/your-image.png 
        -->
        <img src="https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/main/images/main-image.png" alt="Main page visual">
      </div>
    </div>
    <!-- ==== CTA, Text, Hand (right) ==== -->
    <div class="cta-col">
      <div class="main-headline">
        A community for young adults with Type 1 Diabetes in Ireland.
      </div>
      <div class="main-subline">
        Built by and for you. Find support, join research, shape change.
      </div>
      <div class="cta-btns">
        <button class="cta-btn btn-yellow">BUTTON 1</button>
        <button class="cta-btn btn-pink">BUTTON 2</button>
        <button class="cta-btn btn-blue">BUTTON 3</button>
      </div>
      <!-- 
        HAND IMAGE PLACEHOLDER: 
        Replace the src below with your preferred hand SVG/PNG RAW link 
        e.g. https://raw.githubusercontent.com/youruser/yourrepo/main/images/hand.png 
      -->
      <div class="hand-img-holder">
        <img src="https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/main/images/hand-image.png" alt="Inviting hand illustration">
      </div>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer>
    <div class="footer-logos">
      <!-- HRB logo placeholder (swap src with real logo if needed) -->
      <span class="footer-fund-text">Funded by</span>
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/HRB_logo.png" alt="HRB Logo" style="background:white;border-radius:3px;padding:2px 4px;">
      <img src="https://www.universityofgalway.ie/themes/universityofgalway/images/logo.png" alt="University of Galway Logo">
    </div>
    <div class="footer-links">
      <a href="#">FAQ</a>
      <a href="#">Contact</a>
      <a href="#">Subscribe</a>
    </div>
  </footer>
</body>
</html>
