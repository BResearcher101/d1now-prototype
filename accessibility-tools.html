<div id="accessibility-widget">

  <button id="accessibility-toggle">
    Accessibility
  </button>

  <div id="accessibility-panel">

    <div class="access-row">
      <button onclick="setFont('serif')">Serif</button>
      <button onclick="setFont('sans')">Sans</button>
    </div>

    <div class="access-row">
      <button onclick="setTheme('white')">White</button>
      <button onclick="setTheme('sepia')">Sepia</button>
      <button onclick="setTheme('night')">Night</button>
    </div>

    <div class="access-row text-size-row">
      <button onclick="changeTextSize(-1)">A-</button>
      <button onclick="changeTextSize(1)">A+</button>
    </div>

  </div>

</div>

<button id="readAloudFloating" class="floating-read-btn" title="Read aloud">
  🔊
</button>

<style>
#accessibility-widget{
  position:fixed;
  left:24px;
  bottom:170px;
  z-index:9999;
}

#accessibility-toggle{
  background:#144182;
  color:white;
  border:none;
  border-radius:999px;
  padding:14px 20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,0.15);
}

#accessibility-panel{
  display:none;
  background:#111;
  color:#d6cbb5;
  border:1px solid #555;
  margin-top:10px;
  width:200px;
  box-shadow:0 8px 30px rgba(0,0,0,0.25);
}

#accessibility-panel.active{
  display:block;
}

.access-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-bottom:1px solid #444;
}

.access-row:last-child{
  border-bottom:none;
}

.access-row button{
  background:#111;
  color:#d6cbb5;
  border:none;
  padding:12px 10px;
  font-size:1rem;
  cursor:pointer;
  border-right:1px solid #444;
}

.access-row button:last-child{
  border-right:none;
}

.access-row button:hover{
  background:#222;
  color:#fff;
}

.access-row:nth-child(2){
  grid-template-columns:1fr 1fr 1fr;
}

.text-size-row{
  grid-template-columns:1fr 1fr;
}

.floating-read-btn{
  position:fixed;
  left:24px;
  bottom:90px;
  width:64px;
  height:64px;
  border-radius:16px;
  border:none;
  background:#fff;
  box-shadow:0 4px 18px rgba(20,65,130,.14);
  font-size:1.5rem;
  cursor:pointer;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:readPulse 2s infinite;
}

@keyframes readPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.floating-read-btn.reading{
  background:#ff9f1c;
  color:#fff;
  animation:none;
}

/* Theme modes */
body.theme-white{
  background:#ffffff !important;
  color:#111111 !important;
}

body.theme-sepia{
  background:#f4ecd8 !important;
  color:#5b4636 !important;
}

body.theme-night{
  background:#111111 !important;
  color:#f2f2f2 !important;
}

/* Font modes */
body.font-serif{
  font-family:Georgia, "Times New Roman", serif !important;
}

body.font-sans{
  font-family:Inter, Arial, sans-serif !important;
}

@media (max-width:720px){
  #accessibility-widget{
    left:12px;
    bottom:150px;
  }

  .floating-read-btn{
    left:12px;
    bottom:80px;
    width:56px;
    height:56px;
  }
}
</style>

<script>
document.getElementById("accessibility-toggle")
.addEventListener("click", function(){
  document.getElementById("accessibility-panel")
  .classList.toggle("active");
});

let currentFontSize = 100;

function changeTextSize(change){
  currentFontSize += change * 10;
  document.body.style.fontSize = currentFontSize + "%";
}

function setTheme(theme){
  document.body.classList.remove(
    "theme-white",
    "theme-sepia",
    "theme-night"
  );

  if(theme === "white"){
    document.body.classList.add("theme-white");
  }

  if(theme === "sepia"){
    document.body.classList.add("theme-sepia");
  }

  if(theme === "night"){
    document.body.classList.add("theme-night");
  }
}

function setFont(font){
  document.body.classList.remove(
    "font-serif",
    "font-sans"
  );

  if(font === "serif"){
    document.body.classList.add("font-serif");
  }

  if(font === "sans"){
    document.body.classList.add("font-sans");
  }
}

/* Read aloud */
(function () {
  const btn = document.getElementById("readAloudFloating");

  if (!btn || !("speechSynthesis" in window)) return;

  let isReading = false;

  function getText(){
    let text = "";
    const main = document.querySelector("main");
    const extra = document.querySelector(".add-wrap");

    if(main) text += main.innerText + " ";
    if(extra) text += extra.innerText + " ";

    return text.replace(/\s+/g," ").trim();
  }

  function start(){
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(getText());
    utterance.lang = "en-IE";

    utterance.onend = stop;

    speechSynthesis.speak(utterance);

    isReading = true;
    btn.classList.add("reading");
    btn.textContent = "■";
  }

  function stop(){
    speechSynthesis.cancel();

    isReading = false;
    btn.classList.remove("reading");
    btn.textContent = "🔊";
  }

  btn.onclick = function(){
    isReading ? stop() : start();
  };
})();
</script>
