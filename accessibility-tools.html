<div id="accessibility-widget">

  <button 
    id="accessibility-toggle"
    aria-label="Open accessibility options"
    aria-expanded="false"
    aria-controls="accessibility-panel"
    aria-haspopup="true">
    Accessibility
  </button>

  <div 
    id="accessibility-panel"
    role="dialog"
    aria-label="Accessibility options">

    <button id="accessibility-close" aria-label="Close accessibility options">×</button>

    <div class="access-row">
      <button data-font="serif" onclick="setFont('serif')">Serif</button>
      <button data-font="sans" onclick="setFont('sans')">Sans</button>
    </div>

    <div class="access-row theme-row">
      <button data-theme="default" onclick="setTheme('default')">Default</button>
      <button data-theme="white" onclick="setTheme('white')">White</button>
      <button data-theme="sepia" onclick="setTheme('sepia')">Sepia</button>
      <button data-theme="night" onclick="setTheme('night')">Night</button>
      <button data-theme="contrast" onclick="setTheme('contrast')">High contrast</button>
    </div>

    <div class="access-row text-size-row">
      <button onclick="changeTextSize(-1)">A-</button>
      <button onclick="changeTextSize(1)">A+</button>
    </div>

    <div class="access-row action-row">
      <button onclick="toggleMotion()">Pause motion</button>
      <button onclick="resetAccessibility()">Reset</button>
    </div>

  </div>

</div>

<button id="readAloudFloating" class="floating-read-btn" title="Read aloud" aria-label="Read page aloud">
  🔊
</button>

<style>
#accessibility-widget{
  position:fixed;
  left:24px;
  bottom:170px;
  z-index:9999;
}

#accessibility-toggle{
  background:#144182;
  color:white;
  border:none;
  border-radius:999px;
  padding:14px 20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,0.15);
}

#accessibility-toggle:focus,
#accessibility-panel button:focus,
.floating-read-btn:focus{
  outline:4px solid #FDD560;
  outline-offset:3px;
}

#accessibility-panel{
  display:none;
  position:relative;
  background:#111;
  color:#d6cbb5;
  border:1px solid #555;
  margin-top:10px;
  width:260px;
  box-shadow:0 8px 30px rgba(0,0,0,0.25);
}

#accessibility-panel.active{
  display:block;
}

#accessibility-close{
  position:absolute;
  top:6px;
  right:8px;
  background:transparent;
  color:#fff;
  border:none;
  font-size:1.3rem;
  cursor:pointer;
}

.access-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-bottom:1px solid #444;
}

.access-row:first-of-type{
  margin-top:36px;
}

.access-row:last-child{
  border-bottom:none;
}

.theme-row{
  grid-template-columns:1fr 1fr;
}

.action-row{
  grid-template-columns:1fr 1fr;
}

.access-row button{
  background:#111;
  color:#d6cbb5;
  border:none;
  padding:12px 10px;
  font-size:.95rem;
  cursor:pointer;
  border-right:1px solid #444;
}

.access-row button:last-child{
  border-right:none;
}

.access-row button:hover{
  background:#222;
  color:#fff;
}

.access-row button.active{
  background:#FDD560;
  color:#144182;
  font-weight:bold;
}

.floating-read-btn{
  position:fixed;
  left:24px;
  bottom:90px;
  width:64px;
  height:64px;
  border-radius:16px;
  border:none;
  background:#fff;
  box-shadow:0 4px 18px rgba(20,65,130,.14);
  font-size:1.5rem;
  cursor:pointer;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:readPulse 2s infinite;
}

@keyframes readPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.floating-read-btn.reading{
  background:#ff9f1c;
  color:#fff;
  animation:none;
}

/* Font modes */
body.font-serif{
  font-family:Georgia, "Times New Roman", serif !important;
}

/* Pause motion */
body.pause-motion *,
body.pause-motion *::before,
body.pause-motion *::after{
  animation:none !important;
  transition:none !important;
  scroll-behaviour:auto !important;
}

@media (max-width:720px){
  #accessibility-widget{
    left:12px;
    bottom:150px;
  }

  #accessibility-panel{

  }

  .floating-read-btn{
    left:12px;
    bottom:80px;
    width:56px;
    height:56px;
  }
}
</style>

<script>
const accessibilityToggle = document.getElementById("accessibility-toggle");
const accessibilityPanel = document.getElementById("accessibility-panel");
const accessibilityClose = document.getElementById("accessibility-close");

let currentFontSize = Number(localStorage.getItem("d1nowFontSize")) || 100;
let currentTheme = localStorage.getItem("d1nowTheme") || "default";
let currentFont = localStorage.getItem("d1nowFont") || "sans";
let motionPaused = localStorage.getItem("d1nowPauseMotion") === "true";

function openAccessibilityPanel(){
  accessibilityPanel.classList.add("active");
  accessibilityToggle.setAttribute("aria-expanded", "true");
}

function closeAccessibilityPanel(){
  accessibilityPanel.classList.remove("active");
  accessibilityToggle.setAttribute("aria-expanded", "false");
  accessibilityToggle.focus();
}

accessibilityToggle.addEventListener("click", function(){
  if(accessibilityPanel.classList.contains("active")){
    closeAccessibilityPanel();
  } else {
    openAccessibilityPanel();
  }
});

accessibilityClose.addEventListener("click", closeAccessibilityPanel);

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && accessibilityPanel.classList.contains("active")){
    closeAccessibilityPanel();
  }
});

document.addEventListener("click", function(e){
  if(
    accessibilityPanel.classList.contains("active") &&
    !document.getElementById("accessibility-widget").contains(e.target)
  ){
    accessibilityPanel.classList.remove("active");
    accessibilityToggle.setAttribute("aria-expanded", "false");
  }
});

function updateActiveButtons(){
  document.querySelectorAll("[data-theme]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.theme === currentTheme);
  });

  document.querySelectorAll("[data-font]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.font === currentFont);
  });
}

function changeTextSize(change){
  currentFontSize += change * 10;

  if(currentFontSize < 80){
    currentFontSize = 80;
  }

  if(currentFontSize > 160){
    currentFontSize = 160;
  }

  document.body.style.fontSize = currentFontSize + "%";
  localStorage.setItem("d1nowFontSize", currentFontSize);
}

function setTheme(theme){
  document.body.classList.remove(
    "theme-white",
    "theme-sepia",
    "theme-night",
    "theme-contrast"
  );

  currentTheme = theme;

  if(theme !== "default"){
    document.body.classList.add("theme-" + theme);
  }

  localStorage.setItem("d1nowTheme", theme);
  updateActiveButtons();
}

function setFont(font){
  document.body.classList.remove(
    "font-serif",
    "font-sans"
  );

  currentFont = font;

  if(font === "serif"){
    document.body.classList.add("font-serif");
  }

  if(font === "sans"){
    document.body.classList.add("font-sans");
  }

  localStorage.setItem("d1nowFont", font);
  updateActiveButtons();
}

function toggleMotion(){
  motionPaused = !motionPaused;
  document.body.classList.toggle("pause-motion", motionPaused);
  localStorage.setItem("d1nowPauseMotion", motionPaused);
}

function resetAccessibility(){
  currentFontSize = 100;
  currentTheme = "default";
  currentFont = "sans";
  motionPaused = false;

  document.body.style.fontSize = "100%";
  document.body.classList.remove(
    "theme-white",
    "theme-sepia",
    "theme-night",
    "theme-contrast",
    "font-serif",
    "font-sans",
    "pause-motion"
  );

  localStorage.removeItem("d1nowFontSize");
  localStorage.removeItem("d1nowTheme");
  localStorage.removeItem("d1nowFont");
  localStorage.removeItem("d1nowPauseMotion");

  setFont("sans");
  updateActiveButtons();
}

function applySavedAccessibility(){
  document.body.style.fontSize = currentFontSize + "%";
  setTheme(currentTheme);
  setFont(currentFont);

  if(motionPaused){
    document.body.classList.add("pause-motion");
  }

  updateActiveButtons();
}

applySavedAccessibility();

/* Read aloud */
(function () {
  const btn = document.getElementById("readAloudFloating");

  if (!btn || !("speechSynthesis" in window)) return;

  let isReading = false;

  function getText(){
    let text = "";
    const main = document.querySelector("main");
    const extra = document.querySelector(".add-wrap");

    if(main) text += main.innerText + " ";
    if(extra) text += extra.innerText + " ";

    return text.replace(/\s+/g," ").trim();
  }

  function start(){
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(getText());
    utterance.lang = "en-IE";

    utterance.onend = stop;

    speechSynthesis.speak(utterance);

    isReading = true;
    btn.classList.add("reading");
    btn.textContent = "■";
    btn.setAttribute("aria-label", "Stop reading aloud");
  }

  function stop(){
    speechSynthesis.cancel();

    isReading = false;
    btn.classList.remove("reading");
    btn.textContent = "🔊";
    btn.setAttribute("aria-label", "Read page aloud");
  }

  btn.onclick = function(){
    isReading ? stop() : start();
  };
})();
</script>
